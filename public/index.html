<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDA — eToro Dynamic Allocator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px}
.container{max-width:800px;margin:0 auto;padding:1.5rem}
h1{font-size:1.5rem;margin-bottom:0.25rem}
h2{font-size:1.1rem;margin:1rem 0 0.5rem;color:#94a3b8}
.card{background:#1e293b;border-radius:8px;padding:1rem;margin:0.5rem 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0}
.row+.row{border-top:1px solid #334155}
.label{color:#94a3b8}
.badge{padding:2px 8px;border-radius:4px;font-size:0.75rem;font-weight:600}
.badge.online{background:#166534;color:#22c55e}
.badge.offline{background:#7f1d1d;color:#ef4444}
.badge.bullish{background:#166534;color:#22c55e}
.badge.bearish{background:#7f1d1d;color:#ef4444}
.badge.neutral{background:#374151;color:#94a3b8}
table{width:100%;border-collapse:collapse;margin-top:0.5rem}
th{text-align:left;color:#64748b;font-size:0.75rem;padding:0.4rem 0.5rem;border-bottom:1px solid #334155}
td{padding:0.4rem 0.5rem;border-bottom:1px solid #1e293b}
.green{color:#22c55e}
.red{color:#ef4444}
form{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
label{display:flex;flex-direction:column;gap:0.25rem;color:#94a3b8;font-size:0.8rem}
input,select{background:#0f172a;border:1px solid #334155;border-radius:4px;padding:0.4rem 0.5rem;color:#e2e8f0;font-size:0.9rem}
button{background:#3b82f6;color:#fff;border:none;border-radius:4px;padding:0.5rem 1rem;cursor:pointer;font-size:0.85rem;font-weight:600}
button:hover{background:#2563eb}
button:disabled{opacity:0.5;cursor:not-allowed}
button.danger{background:#ef4444}
button.danger:hover{background:#dc2626}
.actions{display:flex;gap:0.5rem;margin-top:0.75rem}
.small{font-size:0.75rem;color:#64748b}
.mt{width:100%;margin-top:0.5rem}
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const API = '';
async function get(path){const r=await fetch(API+path);if(!r.ok)throw await r.text();return r.json()}
async function post(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw await r.text();return r.json()}

function fmt(n, cur='EUR'){
  return new Intl.NumberFormat('en-US',{style:'currency',currency:cur,minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
}

let syncErr = null;
let lastSyncTime = null;

async function syncPortfolio(){
  try {
    const r=await fetch('/api/sync',{method:'POST'});
    const data=await r.json();
    if(data.status==='error'){ syncErr=data.error; return; }
    syncErr=null;
    lastSyncTime=new Date().toISOString();
  } catch(e){ syncErr=e.message||'Sync failed'; }
}

async function render(){
  const app=document.getElementById('app');
  app.innerHTML='<div class="card"><p class="small">Syncing portfolio data…</p></div>';
  await syncPortfolio();
  try {
    const [status,config,sentiment]=await Promise.all([get('/api/status'),get('/api/config'),get('/api/sentiment')]);
    const cur = status.allocator?.currency||'EUR';
    const isErr = syncErr||status.status==='error'||status.allocator===null;
    app.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div>
          <h1>eToro Dynamic Allocator</h1>
          <p class="small">Automated copy trading optimizer</p>
        </div>
        <div style="text-align:right">
          <span class="badge ${!isErr?'online':'offline'}">${!isErr?'LIVE':'ERROR'}</span>
          ${syncErr?`<p class="small" style="color:#ef4444;margin-top:0.25rem">${syncErr}</p>`:''}
        </div>
      </div>

      <h2>Portfolio</h2>
      <div class="card">
        ${status.allocator ? `
        <div class="row"><span class="label">Invested</span><span>${fmt(status.allocator.totalInvested, cur)}</span></div>
        <div class="row"><span class="label">Current Value</span><span>${fmt(status.allocator.currentPortfolioValue, cur)}</span></div>
        <div class="row"><span class="label">P&amp;L</span><span class="${(status.allocator.totalPnlPercent||0)>=0?'green':'red'}">${(status.allocator.totalPnlPercent||0)>=0?'+':''}${(status.allocator.totalPnlPercent||0).toFixed(2)}%</span></div>
        <div class="row"><span class="label">Available Cash</span><span>${fmt(status.allocator.availableCash, cur)}</span></div>
        <div class="row"><span class="label">Last Synced</span><span class="small">${lastSyncTime||status.allocator.lastRebalance||'—'}</span></div>
        ` : '<p class="small">No portfolio data</p>'}
      </div>

      <h2>Active Traders</h2>
      <div class="card">
        ${status.allocator ? traderTable(status.allocator.activeTraders, cur) : '<p class="small">No active allocations</p>'}
      </div>

      <h2>Market Sentiment</h2>
      <div class="card">
        ${sentiment.articlesAnalyzed>0 ? `
        <div class="row"><span class="label">Sentiment</span><span class="badge ${sentiment.label}">${sentiment.label}</span></div>
        <div class="row"><span class="label">Score</span><span>${sentiment.score.toFixed(2)}</span></div>
        <div class="row"><span class="label">Articles</span><span>${sentiment.articlesAnalyzed}</span></div>
        ` : '<p class="small">No news articles fetched. Add NEWS_API_KEY secret to populate sentiment.</p>'}
      </div>

      <h2>Configuration</h2>
      <div class="card">
        <form id="config-form">
          <label>Traders <input name="traderCount" type="number" min="1" max="20" value="${config.traderCount}"></label>
          <label>Take-Profit % <input name="tpPercent" type="number" min="0" max="100" value="${config.tpPercent}"></label>
          <label>Stop-Loss % <input name="slPercent" type="number" min="0" max="100" value="${config.slPercent}"></label>
          <label>Rebalance (hours) <input name="rebalanceHours" type="number" min="1" max="168" value="${config.rebalanceHours}"></label>
          <label>Environment <select name="environment">
            <option value="demo" ${config.environment==='demo'?'selected':''}>Demo</option>
            <option value="real" ${config.environment==='real'?'selected':''}>Real</option>
          </select></label>
        </form>
        <div class="actions">
          <button onclick="saveConfig()">Save Config</button>
          <button class="danger" onclick="triggerRebalance()">Manual Rebalance</button>
          <span id="msg" class="small" style="padding:0.5rem"></span>
        </div>
      </div>

      <h2>Trader Names <span class="small">(optional override)</span></h2>
      <div class="card">
        <p class="small">Trader names are fetched live from the API via <code>parentUsername</code> field. Override any below:</p>
        <div id="names-list"></div>
        <div style="display:flex;gap:0.5rem;margin-top:0.5rem">
          <input id="new-mirror-id" type="number" placeholder="Mirror ID" style="flex:1">
          <input id="new-username" type="text" placeholder="Username" style="flex:1">
          <button onclick="addNameMapping()">Add</button>
        </div>
        <div class="actions">
          <button onclick="saveNameMappings()">Save Name Mappings</button>
        </div>
      </div>
    `;
  } catch(e){
    const msg = e.message||'Unknown error';
    app.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div><h1>eToro Dynamic Allocator</h1></div>
        <span class="badge offline">ERROR</span>
      </div>
      <div class="card"><p style="color:#ef4444">${msg}</p></div>
    `;
  }
}

function traderTable(traders, cur='EUR'){
  if(!traders||traders.length===0)return'<p class="small">No active traders</p>';
  return `<table>
    <tr><th>Trader</th><th>Allocated</th><th>Value</th><th>P&L</th><th>Status</th></tr>
    ${traders.map(t=>`<tr>
      <td>${t.traderName||t.username}</td>
      <td>${fmt(t.allocated, cur)}</td>
      <td>${fmt(t.currentValue, cur)}</td>
      <td class="${(t.pnlPercent||0)>=0?'green':'red'}">${(t.pnlPercent||0)>=0?'+':''}${(t.pnlPercent||0).toFixed(2)}%</td>
      <td><span class="badge ${t.status==='active'?'online':'offline'}">${t.status||'unknown'}</span></td>
    </tr>`).join('')}
  </table>`;
}

function msg(text, ok=true){
  const el=document.getElementById('msg');
  if(el){el.textContent=text;el.style.color=ok?'#22c55e':'#ef4444';setTimeout(()=>el.textContent='',4000)}
}

async function saveConfig(){
  try {
    const form=document.getElementById('config-form');
    const data=Object.fromEntries(new FormData(form));
    data.traderCount=parseInt(data.traderCount);
    data.tpPercent=parseFloat(data.tpPercent);
    data.slPercent=parseFloat(data.slPercent);
    data.rebalanceHours=parseInt(data.rebalanceHours);
    await post('/api/config',data);
    msg('Config saved');
    render();
  } catch(e){msg('Save failed: '+(e.message||e),false)}
}

async function triggerRebalance(){
  try {
    msg('Rebalancing...');
    const r=await fetch('/api/rebalance',{method:'POST'});
    const data=await r.json();
    if(data.error)throw new Error(data.error);
    msg('Rebalance complete: '+data.allocations.length+' traders');
    setTimeout(render,2000);
  } catch(e){msg('Rebalance failed: '+(e.message||e),false)}
}

let nameMappings = {};

async function loadNameMappings(){
  try {
    nameMappings = await get('/api/trader-names');
    renderNameMappings();
  } catch(e){ /* ignore */ }
}

function renderNameMappings(){
  const el = document.getElementById('names-list');
  if(!el)return;
  const entries = Object.entries(nameMappings);
  if(entries.length===0){
    el.innerHTML = '<p class="small">No name mappings yet. Add mirror ID → username pairs below.</p>';
    return;
  }
  el.innerHTML = entries.map(([id,name]) =>
    `<div class="row"><span style="font-family:monospace">mirror-${id}</span><span>→</span><span>${name} <span class="small" onclick="removeNameMapping('${id}')" style="cursor:pointer;color:#ef4444">[x]</span></span></div>`
  ).join('');
}

function addNameMapping(){
  const idEl = document.getElementById('new-mirror-id');
  const nameEl = document.getElementById('new-username');
  const id = idEl.value.trim();
  const name = nameEl.value.trim();
  if(!id||!name)return msg('Enter both mirror ID and username',false);
  nameMappings[id] = name;
  idEl.value = '';
  nameEl.value = '';
  renderNameMappings();
}

function removeNameMapping(id){
  delete nameMappings[id];
  renderNameMappings();
}

async function saveNameMappings(){
  try {
    const entries = Object.fromEntries(Object.entries(nameMappings).filter(([k,v])=>k&&v));
    await post('/api/trader-names', entries);
    msg('Name mappings saved');
    setTimeout(render,500);
  } catch(e){msg('Save failed: '+(e.message||e),false)}
}

loadNameMappings();
render();
</script>
</body>
</html>
